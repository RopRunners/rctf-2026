worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    merge_slashes on;

    resolver 127.0.0.11 valid=1s ipv6=off;

    client_max_body_size 32m;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    resolver_timeout 5s;

    limit_conn_zone $binary_remote_addr zone=perip:4m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    access_log /dev/stdout combined buffer=32k flush=5s;

    server {
        listen 6000 ssl;

        limit_conn perip 128;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.pem;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_client_certificate /etc/nginx/certs/ca_checker.pem;
        ssl_verify_client optional;

        ssl_protocols TLSv1.3;

        location /v2/ {
            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            proxy_pass http://zot:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass_header Authorization;

            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            set $app_upstream http://pipeline-app:8080;
            proxy_pass $app_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}